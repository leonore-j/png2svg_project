[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "png2svg"
version = "0.1.0"
description = "A final pyhton project to convert a png file to svg"
readme = "README.md"
authors = [
    { name = "ls", email = "leonore.jamet@centrale.centralelille.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow",
]

[project.scripts]
png2svg= "png2svg.core:main"

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/png2svg"]