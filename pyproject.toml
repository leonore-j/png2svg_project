[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "png2svg"
version = "0.1.0"
description = "A final pyhton project to convert a png file to svg"
readme = "README.md"
authors = [
    { name = "ls", email = "leonore.jamet@centrale.centralelille.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow",
]

[project.scripts]
png2svg= "png2svg.cli:main"

[dependency-groups]
dev = [
    "marimo>=0.10",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/png2svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]